name: Bug report
description: Report a reproducible bug without sharing credentials or private data.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private emails, or licensed full text.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v2.0.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and minimal input
      description: Redact email addresses, API keys, and private paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and logs
    validations:
      required: true
