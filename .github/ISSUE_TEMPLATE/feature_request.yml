name: Feature request
description: Suggest a source, workflow, or evidence-grading improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What research workflow is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: checkboxes
    id: compliance
    attributes:
      label: Compliance
      options:
        - label: The proposal does not bypass access controls or paid/licensed content restrictions.
          required: true
